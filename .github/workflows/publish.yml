name: Publish AILogExport

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            Write-Error 'Tag must use v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<prerelease>.'
            exit 1
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          if ($version.Contains('-')) {
            'prerelease=true' >> $env:GITHUB_OUTPUT
          else
            'prerelease=false' >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore AILogExport.slnx

      - name: Build
        run: >-
          dotnet build AILogExport.slnx
          --configuration Release
          --no-restore
          -m:1
          -v:minimal
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: >-
          dotnet test AILogExport.slnx
          --configuration Release
          --no-build
          --no-restore
          -m:1
          -v:minimal

      - name: Pack .NET Tool
        run: >-
          dotnet pack src/AILogExport/AILogExport.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/nuget
          -p:PackageVersion=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      # Windows向けpublishで必要になるランタイムパックを取得する。
      - name: Restore Windows x64 runtime
        run: dotnet restore src/AILogExport/AILogExport.csproj --runtime win-x64

      - name: Publish framework-dependent executable
        run: >-
          dotnet publish src/AILogExport/AILogExport.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          --output artifacts/publish/win-x64-framework-dependent
          -p:Version=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      # ランタイムと依存ライブラリを単一の実行ファイルへまとめる。
      - name: Publish self-contained executable
        run: >-
          dotnet publish src/AILogExport/AILogExport.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish/win-x64-self-contained
          -p:Version=${{ steps.version.outputs.value }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      - name: Create executable archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release | Out-Null
          Compress-Archive `
            -Path artifacts/publish/win-x64-framework-dependent/* `
            -DestinationPath artifacts/release/AILogExport-v${{ steps.version.outputs.value }}-win-x64-framework-dependent.zip
          Compress-Archive `
            -Path artifacts/publish/win-x64-self-contained/* `
            -DestinationPath artifacts/release/AILogExport-v${{ steps.version.outputs.value }}-win-x64-self-contained.zip

      - name: Login to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Ovis

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path artifacts/nuget -Filter *.nupkg -File | Select-Object -First 1
          if ($null -eq $package) {
            Write-Error 'NuGet package was not found.'
            exit 1
          }

          dotnet nuget push $package.FullName `
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: AILogExport v${{ steps.version.outputs.value }}
          files: |
            artifacts/nuget/*.nupkg
            artifacts/release/*.zip
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
