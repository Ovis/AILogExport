name: Publish AILogExport

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Tag must use v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-<prerelease>." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore AILogExport.slnx

      - name: Build
        run: >-
          dotnet build AILogExport.slnx
          --configuration Release
          --no-restore
          -m:1
          -v:minimal
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: >-
          dotnet test AILogExport.slnx
          --configuration Release
          --no-build
          --no-restore
          -m:1
          -v:minimal

      - name: Pack .NET Tool
        run: >-
          dotnet pack src/AILogExport/AILogExport.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/nuget
          -p:PackageVersion=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      # Windows向けpublishで必要になるランタイムパックを取得する。
      - name: Restore Windows x64 runtime
        run: dotnet restore src/AILogExport/AILogExport.csproj --runtime win-x64

      - name: Publish framework-dependent executable
        run: >-
          dotnet publish src/AILogExport/AILogExport.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          --output artifacts/publish/win-x64-framework-dependent
          -p:Version=${{ steps.version.outputs.value }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      # ランタイムと依存ライブラリを単一の実行ファイルへまとめる。
      - name: Publish self-contained executable
        run: >-
          dotnet publish src/AILogExport/AILogExport.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish/win-x64-self-contained
          -p:Version=${{ steps.version.outputs.value }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      - name: Create executable archives
        shell: bash
        run: |
          mkdir -p artifacts/release

          pushd artifacts/publish/win-x64-framework-dependent
          zip -r ../../release/AILogExport-v${{ steps.version.outputs.value }}-win-x64-framework-dependent.zip .
          popd

          pushd artifacts/publish/win-x64-self-contained
          zip -r ../../release/AILogExport-v${{ steps.version.outputs.value }}-win-x64-self-contained.zip .
          popd

      - name: Login to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: Ovis

      - name: Push to NuGet.org
        run: >-
          dotnet nuget push artifacts/nuget/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: AILogExport v${{ steps.version.outputs.value }}
          files: |
            artifacts/nuget/*.nupkg
            artifacts/release/*.zip
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
