name: CI

on:
  pull_request:

# 同一Pull Requestで新しいコミットが送信された場合、古い実行を中止する。
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore AILogExport.slnx

      - name: Verify formatting
        run: dotnet format AILogExport.slnx --verify-no-changes --no-restore

      - name: Build
        run: >-
          dotnet build AILogExport.slnx
          --configuration Release
          --no-restore
          -m:1
          -v:minimal
          -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test AILogExport.slnx
          --configuration Release
          --no-build
          --no-restore
          -m:1
          -v:minimal

      # 公開はタグ用ワークフローに限定し、PRではパッケージを作成できることだけを検証する。
      - name: Pack .NET Tool
        run: >-
          dotnet pack src/AILogExport/AILogExport.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:PackageVersion=0.0.0-ci.${{ github.run_number }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      # リリース時に作成するWindows x64向けの両配布形式をPRでも検証する。
      - name: Restore Windows x64 runtime
        run: dotnet restore src/AILogExport/AILogExport.csproj --runtime win-x64

      - name: Publish framework-dependent executable
        run: >-
          dotnet publish src/AILogExport/AILogExport.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          --output artifacts/publish/win-x64-framework-dependent
          -p:Version=0.0.0-ci.${{ github.run_number }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}

      - name: Publish self-contained executable
        run: >-
          dotnet publish src/AILogExport/AILogExport.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output artifacts/publish/win-x64-self-contained
          -p:Version=0.0.0-ci.${{ github.run_number }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryCommit=${{ github.sha }}
